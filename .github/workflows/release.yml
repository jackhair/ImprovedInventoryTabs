name: Publish Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: attach jars to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s extglob
          gh release upload ${{ github.event.release.tag_name }} \
            fabric/build/libs/!(*-sources).jar \
            neoforge/build/libs/!(*-sources).jar --clobber
      # The publishing steps below are skipped until MODRINTH_TOKEN and/or
      # CURSEFORGE_TOKEN secrets are configured for this repository.
      - name: publish fabric jar
        if: ${{ env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 585506
          modrinth-id: F1AqcMCK
          modrinth-featured: true
          modrinth-unfeature-mode: intersection
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/!(*-@(sources)).jar
          version-type: beta
          version-resolver: all
          loaders: |
            fabric
            quilt
      - name: publish neoforge jar
        if: ${{ env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 585506
          modrinth-id: F1AqcMCK
          modrinth-featured: true
          modrinth-unfeature-mode: intersection
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/!(*-@(sources)).jar
          version-type: beta
          version-resolver: all
          loaders: |
            neoforge
