name: Publish Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: attach jars to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s extglob
          gh release upload ${{ github.event.release.tag_name }} \
            fabric/build/libs/!(*-sources).jar \
            neoforge/build/libs/!(*-sources).jar --clobber
      # CurseForge publishing activates once the repository has:
      #   secret  CURSEFORGE_TOKEN  (API token from authors.curseforge.com)
      #   variable CURSEFORGE_ID    (this mod's own CurseForge project id)
      # Modrinth publishing activates the same way via MODRINTH_TOKEN and
      # MODRINTH_ID. Until then these steps are skipped.
      - name: publish fabric jar to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/!(*-@(sources)).jar
          version-type: release
          version-resolver: all
          loaders: |
            fabric
            quilt
      - name: publish neoforge jar to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/!(*-@(sources)).jar
          version-type: release
          version-resolver: all
          loaders: |
            neoforge
      - name: publish fabric jar to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && vars.MODRINTH_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-unfeature-mode: intersection
          files: fabric/build/libs/!(*-@(sources)).jar
          version-type: release
          version-resolver: all
          loaders: |
            fabric
            quilt
      - name: publish neoforge jar to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && vars.MODRINTH_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-unfeature-mode: intersection
          files: neoforge/build/libs/!(*-@(sources)).jar
          version-type: release
          version-resolver: all
          loaders: |
            neoforge
