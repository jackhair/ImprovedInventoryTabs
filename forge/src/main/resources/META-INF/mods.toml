[[dependencies.${mod_id}]]
modId = "forge" #mandatory
mandatory = true
versionRange = "${forge_loader_version_range}" #mandatory
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "cloth_config"
mandatory = true
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
