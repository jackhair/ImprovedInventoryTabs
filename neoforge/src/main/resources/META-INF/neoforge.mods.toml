modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}"
issueTrackerURL = "https://github.com/jackhair/InventoryTabs/issues" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL = "https://github.com/jackhair/InventoryTabs" #optional (displayed in the mod UI)
logoFile = "assets/inventorytabs/icon.png" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory
[[mixins]]
config = "inventorytabs.mixins.json"
[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "[${neoforge_version},)" #mandatory
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "required"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
