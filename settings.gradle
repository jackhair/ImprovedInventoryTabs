pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases')
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'InventoryTabs'
include('common')
include('fabric')
// NeoForge publishes its build for a new Minecraft version some time after
// Mojang does. Until then the NeoForge module can't resolve its toolchain, so
// it's switched off via neoforge_enabled in gradle.properties.
if (providers.gradleProperty('neoforge_enabled').getOrElse('true').toBoolean()) {
    include('neoforge')
}
