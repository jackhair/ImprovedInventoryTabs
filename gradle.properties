# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.4.3
group=com.kqp
java_version=25

# Common
minecraft_version=26.3
mod_name=Improved Inventory Tabs
mod_author=KQP, LiamMCW, Andrew6rant (Andrew Grant), Jack Hair
archives_name=improved-inventory-tabs
mod_id=inventorytabs
license=MIT
description=Adds tabs to your inventory that lead to nearby blocks.
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.5+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
# No NeoForge build for 26.3 yet: the module is excluded until neoforge_enabled is flipped and this points at a 26.3 build
neoforge_enabled=false
neoforge_version=26.2.0.75
neoforge_loader_version_range=[4,)

# Dependencies
clothconfig_version=26.3.158
modmenu_version=21.0.0-beta.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
